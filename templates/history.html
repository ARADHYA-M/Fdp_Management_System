{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Login History</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Staff ID</th>
                <th>Login Time</th>
                <th>Logout Time</th>
            </tr>
        </thead>
        <tbody>
            {% for history in histories %}
            <tr>
                <td>{{ history.id }}</td>
                <td>{{ history.staff_id }}</td>
                <td>{{ history.login_time }}</td>
                <td>{{ history.logout_time }}</td>
            </tr>
            {% else %}
            <tr><td colspan="4">No login history found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
