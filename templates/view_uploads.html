<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Uploaded Files</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2 class="mb-4">📂 Your Uploaded Files</h2>
    {% if uploads %}
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Filename</th>
                    <th>Uploaded On</th>
                </tr>
            </thead>
            <tbody>
                {% for upload in uploads %}
                <tr>
                    <td>{{ upload.filename or 'No Filename' }}</td>
                    <td>{{ upload.created_on.strftime('%Y-%m-%d %H:%M:%S') if upload.created_on else 'No Date' }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="alert alert-info">No uploads found.</div>
    {% endif %}
</body>
</html>
